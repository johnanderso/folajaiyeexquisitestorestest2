<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mom's Fashion Store Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif;}
body {background:#f8f8f8;}
header{background:#111;color:white;padding:20px 10%;display:flex;justify-content:space-between;align-items:center;}
header h1{font-weight:600;}
nav a{color:white;text-decoration:none;margin-left:20px;font-size:14px;}
nav a:hover{color:#ff4081;}
.hero{height:50vh;background:url('https://images.unsplash.com/photo-1521335629791-ce4aec67dd47') center/cover;display:flex;justify-content:center;align-items:center;color:white;text-align:center;}
.hero h2{font-size:36px;background:rgba(0,0,0,0.5);padding:15px;border-radius:10px;}
.products{padding:50px 10%;}
.products h2{text-align:center;margin-bottom:30px;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px;}
.product-card{background:white;padding:15px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1);transition:.3s;}
.product-card:hover{transform:translateY(-8px);}
.product-card img{width:100%;border-radius:10px;}
.product-card h3{margin:10px 0;}
.price{color:#ff4081;font-weight:bold;}
.quantity{font-size:13px;color:gray;}
button{margin-top:10px;padding:10px;width:100%;border:none;background:#111;color:white;border-radius:8px;cursor:pointer;}
button:hover{background:#ff4081;}
.cart{padding:50px 10%;}
.cart h2{text-align:center;margin-bottom:20px;}
.cart-items{margin-bottom:20px;}
.cart-item{display:flex;justify-content:space-between;margin-bottom:10px;background:white;padding:10px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.05);}
.cart-item p{margin:0;}
.total{font-weight:bold;text-align:right;margin-bottom:20px;}
.checkout{background:white;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
.checkout input, .checkout textarea{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;}
.checkout button{width:100%;}
.contact{background:#111;color:white;padding:30px 10%;text-align:center;margin-top:30px;}
.contact p{margin:5px 0;}
footer{text-align:center;padding:20px;background:#000;color:white;font-size:14px;}
.chat-button{position:fixed;bottom:30px;right:30px;background:#ff4081;color:white;border:none;padding:15px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,0.3);}
.chat-box{position:fixed;bottom:90px;right:30px;width:300px;max-height:400px;background:white;border-radius:10px;box-shadow:0 5px 20px rgba(0,0,0,0.3);display:none;flex-direction:column;}
.chat-header{background:#111;color:white;padding:10px;border-radius:10px 10px 0 0;}
.chat-messages{flex:1;padding:10px;overflow-y:auto;}
.chat-messages p{margin:5px 0;}
.chat-input{display:flex;padding:10px;border-top:1px solid #ccc;}
.chat-input input{flex:1;padding:5px;border-radius:5px;border:1px solid #ccc;}
.chat-input button{margin-left:5px;padding:5px 10px;border:none;background:#ff4081;color:white;border-radius:5px;cursor:pointer;}
</style>
</head>
<body>

<header>
<h1>Mom's Fashion Store</h1>
<nav><a href="#">Home</a><a href="#products">Shop</a><a href="#cart">Cart</a><a href="#contact">Contact</a></nav>
</header>

<section class="hero">
<h2>Luxury Fashion & Jewelry Collection</h2>
</section>

<section class="products" id="products">
<h2>Available Products</h2>
<div class="product-grid" id="productGrid">
  <!-- Products will be injected by JS -->
</div>
</section>

<section class="cart" id="cart">
<h2>Your Cart</h2>
<div class="cart-items" id="cartItems"></div>
<p class="total" id="totalPrice">Total: ₦0</p>
<div class="checkout">
<h3>Checkout</h3>
<input type="text" id="customerName" placeholder="Your Name">
<input type="text" id="customerPhone" placeholder="Phone Number">
<textarea id="customerAddress" placeholder="Delivery Address"></textarea>
<button onclick="checkout()">Checkout</button>
</div>
</section>

<section class="contact" id="contact">
<h2>Contact Us</h2>
<p>Phone/WhatsApp: +234 XXX XXX XXXX</p>
<p>Email: yourstore@email.com</p>
<p>Location: Lagos, Nigeria</p>
</section>

<footer>
© 2026 Mom's Fashion Store. All rights reserved.
</footer>

<!-- Chat Button -->
<button class="chat-button" onclick="toggleChat()">💬</button>

<!-- Chat Box -->
<div class="chat-box" id="chatBox">
<div class="chat-header">Chat with Seller</div>
<div class="chat-messages" id="chatMessages"></div>
<div class="chat-input">
<input type="text" id="chatInput" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>
</div>

<script>
// Demo products
const products = [
  {id:1,name:"Designer Dress",price:25000,quantity:5,img:"https://images.unsplash.com/photo-1581044777550-4cfa60707c03"},
  {id:2,name:"Luxury Necklace",price:15000,quantity:10,img:"https://images.unsplash.com/photo-1618354691221-89f0e5a0e0d8"},
  {id:3,name:"Stylish Earrings",price:8000,quantity:8,img:"https://images.unsplash.com/photo-1600185365371-1f6a69b9f8f0"},
  {id:4,name:"Casual Top",price:12000,quantity:12,img:"https://images.unsplash.com/photo-1585386959984-a4155229fdd9"}
];

let cart = [];

function displayProducts(){
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";
  products.forEach(p=>{
    const card = document.createElement("div");
    card.className = "product-card";
    card.innerHTML = `
      <img src="${p.img}" alt="">
      <h3>${p.name}</h3>
      <p class="price">₦${p.price}</p>
      <p class="quantity">Available: ${p.quantity}</p>
      <button onclick="addToCart(${p.id})">Add to Cart</button>
    `;
    grid.appendChild(card);
  });
}

function addToCart(id){
  const product = products.find(p=>p.id===id);
  const cartItem = cart.find(c=>c.id===id);
  if(cartItem){
    if(cartItem.qty < product.quantity){
      cartItem.qty++;
    }else{
      alert("No more stock available!");
      return;
    }
  }else{
    cart.push({id:id,name:product.name,price:product.price,qty:1});
  }
  displayCart();
}

function displayCart(){
  const cartDiv = document.getElementById("cartItems");
  cartDiv.innerHTML = "";
  let total = 0;
  cart.forEach(item=>{
    total += item.price * item.qty;
    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <p>${item.name} x ${item.qty}</p>
      <p>₦${item.price*item.qty} <button onclick="removeItem(${item.id})">Remove</button></p>
    `;
    cartDiv.appendChild(div);
  });
  document.getElementById("totalPrice").innerText = "Total: ₦"+total;
}

function removeItem(id){
  cart = cart.filter(c=>c.id!==id);
  displayCart();
}

function checkout(){
  if(cart.length===0){ alert("Cart is empty!"); return; }
  const name = document.getElementById("customerName").value;
  const phone = document.getElementById("customerPhone").value;
  const address = document.getElementById("customerAddress").value;
  if(!name||!phone||!address){ alert("Please fill all details!"); return; }
  alert(`Thank you ${name}! \n\nPlease make payment to:\nBank: ACCESS BANK\nAccount Name: Mom's Fashion Store\nAccount Number: 1234567890\n\nYour total is ₦${cart.reduce((a,b)=>a+b.price*b.qty,0)}`);
  cart=[];
  displayCart();
}

// Chat functions
function toggleChat(){
  const chat = document.getElementById("chatBox");
  chat.style.display = chat.style.display==="flex"?"none":"flex";
}

function sendMessage(){
  const input = document.getElementById("chatInput");
  if(input.value.trim()==="") return;
  const chatDiv = document.getElementById("chatMessages");
  const p = document.createElement("p");
  p.innerHTML = `<strong>You:</strong> ${input.value}`;
  chatDiv.appendChild(p);
  input.value="";
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

displayProducts();
</script>

</body>
  </html>
